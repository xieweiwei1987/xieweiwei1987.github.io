<!doctype html>
<html><head><meta charset="utf-8"><title>Tesla OAuth Callback</title>
<style>body{font-family:-apple-system,sans-serif;padding:40px;max-width:900px;margin:auto}code{background:#f2f2f2;padding:4px 8px;border-radius:4px;word-break:break-all}</style>
</head><body>
<h2>Tesla OAuth 回调</h2>
<p>请把下面这段 URL 发给 DSH（或复制 code 值）：</p>
<pre><code id="u"></code></pre>
<p>code：<code id="c"></code></p>
<script>
document.getElementById('u').textContent = location.href;
var p = new URLSearchParams(location.search);
document.getElementById('c').textContent = p.get('code') || '(无 code)' + (p.get('error')||'');
</script>
</body></html>
